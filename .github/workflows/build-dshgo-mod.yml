# 云端构建 DSH Go 改版 APK
#
# 用途：在 GitHub Actions 上编译一个「改包名 + 加特权工具」的 DSH Go。
# 产出：可直接下载的 APK artifact，装成与官方版并存的独立应用。
#
# 放置位置：仓库根目录 .github/workflows/build-dshgo-mod.yml
# 触发方式：Actions 页面手动 Run workflow，或 push 到 main。

name: Build DSH Go (mod)

on:
  workflow_dispatch:
    inputs:
      application_id:
        description: '安装身份（必须与官方版不同，否则无法共存）'
        required: true
        default: 'io.github.ccch1mneyyy.dsh_go_dev'
      app_label:
        description: '桌面显示名称'
        required: true
        default: 'DSH Go Mod'
      version_name:
        description: '版本名'
        required: true
        default: '1.0.11'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dshgo-mod.yml'

# 官方 CI 用的版本，保持一致，避免 lockfile / goldens 冲突
env:
  FLUTTER_VERSION: 3.47.7
  NODE_VERSION: 24.22.1
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  android-apk:
    name: Build arm64 release APK
    runs-on: ubuntu-24.04
    # runtime 构建 + flutter build 都比较重，给足时间
    timeout-minutes: 90

    env:
      DSH_MAVEN_MIRRORS: 0
      UV_USE_IO_URING: 0
      APP_ID: ${{ inputs.application_id || 'io.github.ccch1mneyyy.dsh_go_dev' }}
      APP_LABEL: ${{ inputs.app_label || 'DSH Go Mod' }}
      VERSION_NAME: ${{ inputs.version_name || '1.0.11' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # 官方 action 每次都要从 dl.google.com 下载 SDK，在中国区 runner 上会卡住。
      # ubuntu-24.04 镜像本身已预装 Android SDK，直接复用即可。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "::error::预装 Android SDK 不存在，无法继续"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "复用的 SDK 路径: $SDK"
          ls "$SDK" || true
          echo "--- platforms ---"
          ls "$SDK/platforms" || true

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      # ---------- 1. 构建内置运行时（rootfs + 桥接），APK 打包要用 ----------
      - name: Cache runtime artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out
          key: runtime-r15-arm64-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}

      - name: Install runtime build tools
        run: |
          set -euo pipefail
          # build-runtime.sh 第 91 行会检查这 5 个工具，缺一个就直接退出
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 xz-utils curl tar coreutils
          echo "--- 工具检查 ---"
          command -v curl python3 tar xz sha256sum
          python3 --version
          xz --version | head -1

      - name: Build runtime (arm64-v8a)
        env:
          # 锁文件 runtime/locks/ubuntu-noble-*.json 里钉的是旧版 deb，镜像上已 404。
          # 设为 1 让脚本重新解析 noble/noble-updates/noble-security 的 Packages，
          # 自动取到当前版本号和 sha256，而不是死盯过期锁文件。
          UPDATE_DEB_LOCK: "1"
        run: |
          # 不要用 | tail 吞掉退出码：脚本失败必须让这一步失败
          set -o pipefail
          bash runtime/build-runtime.sh arm64-v8a
          echo "=== runtime/out 顶层 ==="
          ls -la runtime/out/
          echo "=== arm64-v8a/assets/runtime ==="
          ls -la runtime/out/arm64-v8a/assets/runtime/ || {
            echo "::error::rootfs 没生成，APK 会是空壳"
            exit 1
          }
          SIZE=$(stat -c %s runtime/out/arm64-v8a/assets/runtime/rootfs-arm64-v8a.tar.xz 2>/dev/null || echo 0)
          echo "rootfs 大小: $SIZE 字节"
          # 官方包是 159 MB；小于 100 MB 基本可以断定构建不完整
          if [ "$SIZE" -lt 100000000 ]; then
            echo "::error::rootfs 只有 $SIZE 字节，明显不完整（官方约 159 MB）"
            exit 1
          fi

      # ---------- 2. 改包名 + 改显示名 + 加特权工具 ----------
      - name: Patch applicationId and label
        run: |
          set -euo pipefail
          GRADLE=app/android/app/build.gradle.kts
          MANIFEST=app/android/app/src/main/AndroidManifest.xml

          # applicationId：安装身份，决定能否与官方版共存
          sed -i "s|applicationId = \"io.github.ccch1mneyyy.dsh_app\"|applicationId = \"$APP_ID\"|" "$GRADLE"
          # namespace 保持不变（代码包名不动，Kotlin 一行不用改）

          # 桌面显示名，避免和官方版混淆
          sed -i "s|android:label=\"DSH Go\"|android:label=\"$APP_LABEL\"|" "$MANIFEST"

          echo "--- patched ---"
          grep -n 'applicationId\|namespace' "$GRADLE" | head
          grep -n 'android:label' "$MANIFEST" | head -2

      - name: Apply privileged-tool patch
        run: |
          set -euo pipefail
          # 把「只加不改」补丁应用进来；补丁文件随仓库提交在 patches/ 下
          if [ -f patches/0001-privileged-tools.patch ]; then
            git apply --verbose patches/0001-privileged-tools.patch
          else
            echo "::error::patches/0001-privileged-tools.patch 不存在，拒绝构建一个假的特权版"
            exit 1
          fi

      # ---------- 3. 编译 ----------
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Generate local.properties
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build APK
        working-directory: app
        run: |
          set -o pipefail
          # versionCode 上限 2147483647；date +%y%m%d 得到 6 位（约 26 万），安全
          BUILD_NUMBER="$(date +%y%m%d)"
          echo "versionCode=$BUILD_NUMBER"
          flutter build apk --release \
            --flavor arm64 \
            --target-platform android-arm64 \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define="DSH_APP_VERSION=$VERSION_NAME+$BUILD_NUMBER" \
            --verbose 2>&1 | tail -400

      - name: Collect artifact
        run: |
          mkdir -p out
          find app/build/app/outputs -name '*.apk' -exec cp -v {} out/ \;
          ls -la out/

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dshgo-mod-apk
          path: out/*.apk
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "## 构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 安装身份 | \`$APP_ID\` |"
            echo "| 显示名 | $APP_LABEL |"
            echo "| 版本 | $VERSION_NAME |"
            echo "| 签名 | debug（GitHub 生成） |"
            echo ""
            echo "下载 artifact **dshgo-mod-apk**，与官方版并存安装。"
          } >> "$GITHUB_STEP_SUMMARY"
